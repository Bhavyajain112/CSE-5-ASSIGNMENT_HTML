<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Admission</title>
</head>

<body>

<header>
    <h1>ABC College Admission Portal</h1>
</header>

<section>
    <h2>Available Courses</h2>

    <table border="1">
        <tr>
            <th>Course</th>
            <th>Duration</th>
        </tr>

        <tr>
            <td>BCA</td>
            <td>3 Years</td>
        </tr>

        <tr>
            <td>B.Tech</td>
            <td>4 Years</td>
        </tr>
    </table>
</section>

<section>
    <h2>Admission Form</h2>

    <form>

        <label>Name:</label>
        <input type="text" required><br><br>

        <label>Email:</label>
        <input type="email" required><br><br>

        <label>Mobile:</label>
        <input type="text"
        pattern="[0-9]{10}"
        required><br><br>

        <label>Course:</label>
        <select>
            <option>BCA</option>
            <option>B.Tech</option>
        </select>

        <br><br>

        <button type="submit">Apply</button>

    </form>
</section>

<footer>
    <p>&copy; 2026 ABC College</p>
</footer>

</body>
</html>
